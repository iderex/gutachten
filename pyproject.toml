[project]
name = "gutachten"
version = "0.0.0"
description = "Open, parameterised toolmark comparison with a sensitivity analysis and a likelihood ratio"
readme = "README.md"
# Pinned to a range rather than a single version so a contributor is not forced
# onto one interpreter build, and bounded above so a new release cannot enter a
# recorded run without a change to this file. The workflows install from this
# same range.
requires-python = ">=3.12,<3.14"

# Every direct dependency here is permissively licensed, and that is a
# constraint rather than a coincidence. The license of this repository is not
# decided yet (see https://github.com/iderex/gutachten/issues/2). A copyleft
# dependency in the resolved graph would decide it, because a distributed work
# that links one inherits its terms, and the decision would then have been made
# inside a lockfile instead of by the maintainer. The nearest prior art is
# GPL-3, which is exactly the foreclosure this list avoids: that code is read,
# and it is not linked. Adding a copyleft dependency needs its own issue saying
# what it costs.
dependencies = [
    # BSD-3-Clause. Arrays and the numerical core.
    "numpy>=2.1,<3",
    # BSD-3-Clause. Two dimensional correlation, optimisation, robust fitting.
    "scipy>=1.14,<2",
    # BSD-3-Clause. Morphology and masking over the surface.
    "scikit-image>=0.24,<1",
    # BSD-3-Clause. Score distribution models and calibration.
    "statsmodels>=0.14,<1",
    # BSD-3-Clause. Bootstrapping, resampling and the statistical layer.
    "scikit-learn>=1.5,<2",
    # PSF-based, BSD-compatible. Figures, rendered to a file and never a window.
    "matplotlib>=3.9,<4",
]

[dependency-groups]
# Development tooling, installed by `uv sync` and never shipped in the wheel.
# The no-copyleft constraint above is a constraint on what a distributed work
# links, and none of this is distributed or linked. Hypothesis is MPL-2.0, which
# is copyleft at file level, and it is here deliberately and disclosed rather
# than quietly folded into the sentence above. It imposes nothing on this
# repository as a test-time tool. If it ever moves into the runtime
# dependencies, that is a new decision and the license question in
# https://github.com/iderex/gutachten/issues/2 is where it goes.
dev = [
    # MIT. The test runner.
    "pytest>=8.3,<9",
    # MIT. Coverage measurement and the floor, wired into the pytest run.
    "pytest-cov>=6.0,<8",
    # MPL-2.0, copyleft, test-time only. Property tests over generated inputs.
    "hypothesis>=6.112,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Configured here rather than in a scattering of files, so there is one place a
# contributor looks and one place a setting can be wrong.
minversion = "8.0"
testpaths = ["tests"]
# The repository root on the path so `tests.support` is importable from a test.
pythonpath = ["."]
# harness/ is what the gate does not run. It is excluded by configuration rather
# than by a skip scattered through the suite, so that a run which covered less
# than the whole set cannot be read as one that covered it and found nothing.
#
# This setting REPLACES pytest's defaults rather than extending them, so the
# defaults are restated here and `harness` is added to them. Listing only
# `harness` was tried first and made the suite fail to collect at all the moment
# a tool wrote a dot directory into the tree, because `.*` had silently stopped
# being ignored.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "harness",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=gutachten",
    "--cov=tests/support",
    "--cov-report=term-missing",
    # The floor. Coverage here is a check on what was never exercised at all,
    # not a quality score, so this number is the level below which a whole
    # module has plainly never been imported by anything. It is set by argument
    # rather than at whatever the first run happened to print, and the argument
    # is in the issue that introduced it. Raise it when the tree earns it; do
    # not lower it to make a run pass.
    "--cov-fail-under=90",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["gutachten", "tests/support"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.hatch.build.targets.wheel]
# The package lives under src/ rather than at the repository root. That is what
# keeps an accidental import of the working directory from passing a test which
# would fail against the installed package, because with a src layout the
# working directory holds no importable `gutachten` at all.
packages = ["src/gutachten"]
