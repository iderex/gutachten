[project]
name = "gutachten"
version = "0.0.0"
description = "Open, parameterised toolmark comparison with a sensitivity analysis and a likelihood ratio"
readme = "README.md"
# Pinned to a range rather than a single version so a contributor is not forced
# onto one interpreter build, and bounded above so a new release cannot enter a
# recorded run without a change to this file. The workflows install from this
# same range.
requires-python = ">=3.12,<3.14"

# Every direct dependency here is permissively licensed, and that is a
# constraint rather than a coincidence. The license of this repository is not
# decided yet (see https://github.com/iderex/gutachten/issues/2). A copyleft
# dependency in the resolved graph would decide it, because a distributed work
# that links one inherits its terms, and the decision would then have been made
# inside a lockfile instead of by the maintainer. The nearest prior art is
# GPL-3, which is exactly the foreclosure this list avoids: that code is read,
# and it is not linked. Adding a copyleft dependency needs its own issue saying
# what it costs.
dependencies = [
    # BSD-3-Clause. Arrays and the numerical core.
    "numpy>=2.1,<3",
    # BSD-3-Clause. Two dimensional correlation, optimisation, robust fitting.
    "scipy>=1.14,<2",
    # BSD-3-Clause. Morphology and masking over the surface.
    "scikit-image>=0.24,<1",
    # BSD-3-Clause. Score distribution models and calibration.
    "statsmodels>=0.14,<1",
    # BSD-3-Clause. Bootstrapping, resampling and the statistical layer.
    "scikit-learn>=1.5,<2",
    # PSF-based, BSD-compatible. Figures, rendered to a file and never a window.
    "matplotlib>=3.9,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The source tree does not exist yet, so there is nothing to build and install
# from this project itself. Only the dependencies are synced. The layout issue
# is what creates src/gutachten/ and removes this line.
package = false
